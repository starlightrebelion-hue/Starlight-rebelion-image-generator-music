<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StoryForge</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">Story<span>Forge</span></div>
    <div class="project">
      <select id="project"></select>
      <small id="projectNote"></small>
      <div class="row" id="projectActions" style="margin-top:8px"></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div class="topbar">
      <div class="row">
        <button class="btn menu-btn" id="menu">☰</button>
        <div class="queue" id="queue">Cola: —</div>
      </div>
      <div class="row">
        <button class="btn" id="refresh">Actualizar</button>
        <button class="btn" id="regen">Regenerar pendientes</button>
        <button class="btn primary" id="next" style="display:none">Siguiente →</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="drawer" id="drawer"></div>
<div class="lightbox" id="lightbox"><img alt=""></div>
<div class="toast" id="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
